<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>RSVP | 양경민 &amp; 우지수</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rose-bg: #ead5d2;
        --text-main: #6f2521;
        --text-soft: #ab7e77;
        --line: rgba(111, 37, 33, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--rose-bg);
        color: var(--text-main);
        font-family: "Noto Serif KR", serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .page {
        width: min(100%, 430px);
        min-height: 100vh;
        min-height: 100svh;
        margin: 0 auto;
        background: var(--rose-bg);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 4.15rem;
        padding: 0 1.4rem;
        background: rgba(234, 213, 210, 0.96);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line);
      }

      .back-btn {
        color: var(--text-main);
        text-decoration: none;
        font-size: 2rem;
        line-height: 1;
      }

      .title {
        margin: 0;
        font-family: "Cormorant Garamond", serif;
        font-size: 2.2rem;
      }

      .menu-btn {
        width: 2.25rem;
        height: 2.25rem;
        border: 0;
        background: transparent;
        display: grid;
        place-items: center;
        padding: 0;
      }

      .menu-btn span {
        display: block;
        width: 1.3rem;
        height: 2px;
        background: var(--text-main);
        border-radius: 999px;
        margin: 0.16rem 0;
      }

      .content {
        padding: 2.1rem 1.5rem 3rem;
      }

      .intro {
        margin: 0 0 2rem;
        color: var(--text-soft);
        font-size: 1rem;
        line-height: 1.8;
      }

      .field {
        margin-top: 2rem;
      }

      .field label {
        display: block;
        margin-bottom: 0.8rem;
        font-size: 1.12rem;
      }

      .field input,
      .field textarea {
        width: 100%;
        padding: 0.92rem 0;
        border: 0;
        border-bottom: 1px solid rgba(111, 37, 33, 0.18);
        border-radius: 0;
        background: transparent;
        color: var(--text-main);
        font-size: 1.04rem;
      }

      .field textarea {
        min-height: 9rem;
        padding: 1rem;
        border: 1px solid rgba(111, 37, 33, 0.16);
        background: rgba(255, 255, 255, 0.08);
        resize: vertical;
      }

      .option-grid {
        display: grid;
        gap: 0.8rem;
      }

      .option-grid.two {
        grid-template-columns: 1fr 1fr;
      }

      .option-grid.three {
        grid-template-columns: repeat(3, 1fr);
      }

      .option-btn {
        min-height: 4.2rem;
        border: 1px solid rgba(111, 37, 33, 0.16);
        background: transparent;
        color: #bc9891;
        font-size: 1.08rem;
      }

      .option-btn.active {
        background: rgba(255, 255, 255, 0.12);
        color: var(--text-main);
        border-color: rgba(111, 37, 33, 0.28);
      }

      .guest-stepper {
        display: flex;
        align-items: center;
        gap: 1.4rem;
        margin-top: 0.8rem;
      }

      .stepper-btn {
        width: 3.9rem;
        height: 3.9rem;
        border: 1px solid rgba(111, 37, 33, 0.18);
        border-radius: 50%;
        background: transparent;
        color: var(--text-main);
        font-size: 2rem;
      }

      .stepper-value {
        min-width: 2rem;
        text-align: center;
        font-family: "Cormorant Garamond", serif;
        font-size: 2rem;
      }

      .required {
        color: #d87f73;
      }

      .actions {
        display: flex;
        gap: 0.7rem;
        margin-top: 1.4rem;
      }

      .actions a,
      .actions button {
        flex: 1;
        min-height: 3rem;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
      }

      .ghost-btn {
        border: 1px solid rgba(111, 37, 33, 0.18);
        background: transparent;
        color: var(--text-main);
      }

      .primary-btn {
        border: 0;
        background: var(--text-main);
        color: #fff;
      }

      .success {
        display: none;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 1rem;
        background: rgba(111, 37, 33, 0.08);
        color: var(--text-main);
        font-size: 0.94rem;
        line-height: 1.7;
      }

      .success.open {
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      const RSVP_DATA = {
        intro: [
          "결혼식에 참석해주시는 모든 분들을",
          "더욱 특별하게 모시고자 하오니,",
          "참석 여부 전달을 부탁드립니다.",
        ],
        sideOptions: ["신랑측", "신부측"],
        attendOptions: ["참석할게요", "참석이 어려워요"],
        mealOptions: ["예", "아니요", "미정"],
        googleScriptUrl: "https://script.google.com/macros/s/AKfycbx5aVu3-aZnu-3PqRnaCr2EAQ21Fio7e5T-I18gPkt0CQsUllPlo8DJdvIHz-QxJR7oeA/exec",
      };
    </script>

    <div class="page">
      <header class="topbar">
        <a class="back-btn" href="./index.html">‹</a>
        <h1 class="title">RSVP</h1>
        <button class="menu-btn" type="button" aria-label="장식">
          <div>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </button>
      </header>

      <main class="content">
        <p class="intro" id="rsvpIntro"></p>

        <form id="rsvpForm">
          <input id="rsvpCreatedAt" name="createdAt" type="hidden" value="" />
          <input id="rsvpSource" name="source" type="hidden" value="" />
          <div class="field">
            <label>어느 측 하객이신가요?<span class="required">*</span></label>
            <div class="option-grid two" id="sideOptions"></div>
            <input type="hidden" id="rsvpSide" name="side" required />
          </div>

          <div class="field">
            <label>참석하실 수 있나요?<span class="required">*</span></label>
            <div class="option-grid two" id="attendOptions"></div>
            <input type="hidden" id="rsvpAttend" name="attendance" required />
          </div>

          <div class="field">
            <label>식사 여부</label>
            <div class="option-grid three" id="mealOptions"></div>
            <input type="hidden" id="rsvpMeal" name="meal" />
          </div>

          <div class="field">
            <label for="rsvpName">성함<span class="required">*</span></label>
            <input id="rsvpName" name="name" type="text" placeholder="참석자 본인 성함" required />
          </div>

          <div class="field">
            <label for="rsvpPhone">연락처</label>
            <input id="rsvpPhone" name="phone" type="text" placeholder="010-0000-0000" />
          </div>

          <div class="field">
            <label>동행인 수 (본인 제외)</label>
            <div class="guest-stepper">
              <button class="stepper-btn" id="guestMinus" type="button">−</button>
              <div class="stepper-value" id="guestCount">0</div>
              <button class="stepper-btn" id="guestPlus" type="button">+</button>
            </div>
            <input type="hidden" id="rsvpGuests" name="guests" value="0" />
          </div>

          <div class="field">
            <label for="rsvpGuestNames">동행인 성함</label>
            <input id="rsvpGuestNames" name="guest_names" type="text" placeholder="동행하시는 분의 성함" />
          </div>

          <div class="field">
            <label for="rsvpMessage">전달사항</label>
            <textarea id="rsvpMessage" name="message" maxlength="200" placeholder="축하 메시지나 전달사항을 남겨주세요"></textarea>
          </div>

          <div class="actions">
            <a class="ghost-btn" href="./index.html">닫기</a>
            <button class="primary-btn" type="submit">전달하기</button>
          </div>
        </form>

        <div class="success" id="rsvpSuccess">
          참석 의사가 저장되었습니다.
        </div>
        <iframe name="rsvpSubmitFrame" id="rsvpSubmitFrame" style="display: none"></iframe>
      </main>
    </div>

    <script>
      const $ = (selector) => document.querySelector(selector);

      function renderOptionButtons(containerSelector, inputSelector, options) {
        const container = $(containerSelector);
        const input = $(inputSelector);
        if (!container || !input) return;

        container.innerHTML = "";

        options.forEach((option) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "option-btn";
          button.textContent = option;
          button.addEventListener("click", () => {
            input.value = option;
            [...container.querySelectorAll(".option-btn")].forEach((item) => {
              item.classList.toggle("active", item === button);
            });
          });
          container.appendChild(button);
        });
      }

      function initPage() {
        $("#rsvpIntro").innerHTML = RSVP_DATA.intro.join("<br />");
        renderOptionButtons("#sideOptions", "#rsvpSide", RSVP_DATA.sideOptions);
        renderOptionButtons("#attendOptions", "#rsvpAttend", RSVP_DATA.attendOptions);
        renderOptionButtons("#mealOptions", "#rsvpMeal", RSVP_DATA.mealOptions);

        const guestsInput = $("#rsvpGuests");
        const guestCount = $("#guestCount");
        const setGuestCount = (nextValue) => {
          const value = Math.max(0, nextValue);
          guestsInput.value = String(value);
          guestCount.textContent = String(value);
        };

        $("#guestMinus").addEventListener("click", () => {
          setGuestCount(Number(guestsInput.value || "0") - 1);
        });

        $("#guestPlus").addEventListener("click", () => {
          setGuestCount(Number(guestsInput.value || "0") + 1);
        });

        $("#rsvpForm").addEventListener("submit", (event) => {
          event.preventDefault();
          if (!$("#rsvpSide").value || !$("#rsvpAttend").value || !$("#rsvpName").value.trim()) {
            alert("필수 항목을 입력해주세요.");
            return;
          }

          $("#rsvpCreatedAt").value = new Date().toISOString();
          $("#rsvpSource").value = window.location.href;

          const formData = Object.fromEntries(new FormData($("#rsvpForm")).entries());
          const payload = { ...formData };

          const submitToStorageOnly = () => {
            const saved = JSON.parse(localStorage.getItem("wedding-rsvp-list") || "[]");
            saved.push(payload);
            localStorage.setItem("wedding-rsvp-list", JSON.stringify(saved));
          };

          const finishSuccess = () => {
            $("#rsvpSuccess").classList.add("open");
            $("#rsvpForm").reset();
            $("#rsvpSide").value = "";
            $("#rsvpAttend").value = "";
            $("#rsvpMeal").value = "";
            setGuestCount(0);
            document.querySelectorAll(".option-btn").forEach((button) => button.classList.remove("active"));
          };

          const endpoint = RSVP_DATA.googleScriptUrl.trim();
          if (!endpoint) {
            submitToStorageOnly();
            $("#rsvpSuccess").textContent =
              "구글시트 URL이 아직 연결되지 않아 현재 기기 임시 저장으로 처리되었습니다.";
            finishSuccess();
            return;
          }

          try {
            const form = $("#rsvpForm");
            const previousAction = form.getAttribute("action") || "";
            const previousMethod = form.getAttribute("method") || "";
            const previousTarget = form.getAttribute("target") || "";

            form.setAttribute("action", endpoint);
            form.setAttribute("method", "POST");
            form.setAttribute("target", "rsvpSubmitFrame");
            form.submit();

            $("#rsvpSuccess").textContent = "참석 의사가 구글시트에 저장되었습니다.";
            finishSuccess();

            if (previousAction) form.setAttribute("action", previousAction);
            else form.removeAttribute("action");
            if (previousMethod) form.setAttribute("method", previousMethod);
            else form.removeAttribute("method");
            if (previousTarget) form.setAttribute("target", previousTarget);
            else form.removeAttribute("target");
          } catch (error) {
            submitToStorageOnly();
            $("#rsvpSuccess").textContent =
              "시트 저장에 실패해 현재 기기 임시 저장으로 처리되었습니다.";
            finishSuccess();
          }
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initPage);
      } else {
        initPage();
      }
    </script>
  </body>
</html>
